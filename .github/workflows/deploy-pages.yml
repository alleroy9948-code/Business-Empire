name: Deploy Business Empire to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore editable game source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f index.html ]; then
            cat bootstrap/part-*.txt | base64 --decode | gzip -dc > index.html
            rm -rf bootstrap
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Restore editable game source from transfer package"
            git push origin HEAD:main
          fi

      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp .nojekyll site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
